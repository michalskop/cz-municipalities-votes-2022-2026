# Source config for Brno. Populated 2026-08-04, re-investigated and resolved 2026-08-06/07 (C2).
#
# STATUS (2026-08-07): primary endpoint re-verified DOWN; a genuine, live, per-person fallback
# was found and is now the primary data source for the pipeline (`brno/scripts/downloader.py`
# fetches `zastupko_current.url` below). Investigation trail kept in full — see both entries.
#
# UPDATE (2026-08-26): `zastupko_current.url` was pointed at a STALE MIRROR (`brno.zastupko.cz`),
# not the real origin. Confirmed via the city's own official dashboard for this exact dataset
# (`data.brno.cz/apps/46c26ea8be4549f099e0b80113e0eb64/explore`, ArcGIS item id
# `46c26ea8be4549f099e0b80113e0eb64`) — its item metadata credits the source feed at
# `zastupko.fit.vutbr.cz` (FIT VUT's own domain), not `brno.zastupko.cz`. Direct comparison: the
# mirror had 30 sessions ending Z9/30 (2025-11-11) — exactly the "~9-month gap" this file
# previously documented as a source-side lag; the origin has 36 sessions ending Z9/36
# (2026-06-23), with only Z9/37 (2026-09-15) scheduled and not yet held. The "lag" was never a
# real gap in the source, only in which copy of it this pipeline was pointed at. URL switched
# below; see `coverage_and_known_gap` (updated) and `schema` (now notes a field-name drift between
# the two copies that `standardize.py`'s `_session_date()` handles).

zastupitelstvo_kod_brno:
  status: "DOWN — HTTP 503, re-verified 2026-08-06 and again 2026-08-07 (repeated retries, with
    and without a browser User-Agent, various path suffixes, all 503; kod.brno.cz root and
    data.brno.cz both still 200, so this is endpoint-specific, not sitewide). No longer used as
    the primary source for C2; kept here for reference/future re-check only."
  type: json
  url: "https://kod.brno.cz/zastupitelstvo/"
  note: >
    Endpoint used by the legacy scraper (legacy/brno/scripts/downloader.py); when it worked, it
    returned a JSON object with a "data" array, one entry per vote event, including
    "parties" -> "votes" for per-person options. Vocabulary: Ano/Ano (VK) = yes, Ne/Ne (VK) = no,
    Zdržel se/Zdržel se (VK) = abstain, nepřít. = absent, Nehlasoval/Nehlasoval (VK) = not voting.
    Also published a separate "details": {"yes", "no", "abstained", "present"} aggregate per
    event alongside the per-person votes — that made a genuine independent G2 cross-check
    possible when this endpoint worked. If it ever comes back, it's worth re-evaluating as the
    primary source since it has that built-in aggregate (the zastupko.cz replacement below does
    not). Re-check periodically; not investigated further why it went down or whether it will
    return.

zastupko_current:
  status: "LIVE, VERIFIED 2026-08-26 — origin server (not the brno.zastupko.cz mirror
    originally used, see the UPDATE note above); now the primary source."
  type: json
  url: "https://zastupko.fit.vutbr.cz/flask/brno/zastupitelstvo/9/dataset"
  mirror_vs_origin: >
    Two distinct servers serve what looks like the same feed: `brno.zastupko.cz` (used here
    2026-08-07 through 2026-08-25 — a stale mirror/proxy, frozen at 30 sessions/Z9/30/
    2025-11-11 the whole time) and `zastupko.fit.vutbr.cz` (FIT VUT's own origin — 36 sessions/
    Z9/36/2026-06-23 as of 2026-08-26, actively updated). Both are otherwise structurally
    identical (same municipalita/politickeSubjekty/zastupitele/zastupitelstva shape, same
    hlasovani-level fields, same person/vote ids) except for one schema-level drift: session
    objects on the mirror have a `datum` field (matching schema-CZ.json, the documented spec);
    the origin's session objects have `datum_od`/`datum_do` instead (undocumented — the schema
    repo hasn't been updated to match). `standardize.py`'s `_session_date()` accepts either.
    Person/party counts also differ (60 zastupitele / 11 politickeSubjekty on the origin vs. 58 /
    8 on the mirror) — expected, since 6 more sessions plausibly bring in new substitutes/klubs.
    Re-verify this origin-vs-mirror relationship if either URL ever 404s or the gap reappears —
    it's not documented anywhere except by direct comparison, done here on 2026-08-26.
  discovered_via: >
    The ArcGIS Hub "explore" page (`data.brno.cz/documents/mestobrno::hlasování-zastupitelstva...`)
    doesn't serve real content to a naive fetch (JS SPA), so it was resolved via the ArcGIS Item
    API search instead: `https://www.arcgis.com/sharing/rest/search?q=hlasování zastupitelstva
    brno&f=json` returns item id `f3c663acc9c047cfa898afea94ea3711`
    ("Hlasování zastupitelstva 2022–2024/ City council voting data 2022–2024", owner
    OpenDataBrno) whose description embeds the real JSON feed URL above. A second ArcGIS item
    (`46c26ea8be4549f099e0b80113e0eb64`, a web-mapping app) confirms the same feed and additionally
    links dataset id 8 (term 2018–2022, not used here) and documents the data model repo.
  platform: >
    Built by `zastupko.cz` (FIT VUT Brno project, `zastupko.fit.vutbr.cz`), NOT kod.brno.cz's own
    platform — a different vendor/pipeline entirely, despite covering the same council. Dataset
    id 9 = term 2022–2026 (`poradiZastupitelstva: 9`); id 8 = term 2018–2022 (prior term, not
    used); id 10 = the *next* term (2026–2030) already provisioned but empty
    (`{"zastupitelstva":[{"do":null,"od":null,...,"zasedani":[]}]}`) — confirms 9 is the correct,
    current dataset and 10 is not usable yet.
  schema: >
    Documented at https://github.com/zastupko/data-model (schema.json / schema-CZ.json, CC BY
    4.0), against the mirror's shape — see `mirror_vs_origin` above for where the live origin has
    drifted from it. Nested structure: municipalita -> politickeSubjekty (party list,
    id/zkrNazev/barva) -> zastupitele (council members: id, jmeno, prijmeni, politickeSubjekty[]
    with od/do date intervals — i.e. REAL per-party-membership intervals, not inferred) ->
    zastupitelstva[0] (the term) -> koalice[] (coalition composition, od/do) + lidr[]
    (mayor/leader, od/do) -> zasedani[] (meetings: cislo, id, plus EITHER `datum` (documented) OR
    `datum_od`/`datum_do` (undocumented, the live origin's current shape) — no `url` field on the
    origin's session objects, unlike the mirror's `url.zaznam`, but standardize.py never read that
    field anyway) -> hlasovani[] (vote events: id, cislo, cas, platne, prijato, proceduralni,
    blokove, tajne, projednavano[] (agenda item(s): predmetHlasovani, cisloUsneseni,
    klicovaSlova[], urlNavrh), urlProtokol, sumarizace (aggregate fallback, only used "if
    individual votes aren't available" — confirmed 0/2813 events use it in this dataset, always
    per-person data instead), zastupiteleHlasy[] (idZastupitel, hlas, prezencne)).
  vote_option_vocabulary: >
    Single-letter codes (schema-CZ.json's `hlas` enum), different from kod.brno.cz's Czech-word
    vocabulary: "A" = Ano/pro -> yes, "N" = Ne/proti -> no, "Z" = Zdržel/a se -> abstain,
    "–" (en dash) = Nepřítomen/nepřítomna -> absent, "X" = Nehlasoval/a -> not voting. Schema also
    defines "O" (Omluven/a, excused) and "T" (Tajná, secret) but neither occurs even once in the
    observed data (2022-10-20 through 2025-11-11) — standardize.py intentionally does not map
    them (raises loudly if ever encountered, rather than guessing a dt-standard option for them).
  coverage_and_known_gap: >
    RESOLVED 2026-08-26 (was previously documented as a ~9-month gap — that gap was an artifact
    of using the stale mirror, see the UPDATE note at the top of this file, not a real source-side
    lag). The origin now live-verified spans 2022-10-20 (Z9/01, first session of the term) through
    2026-06-23 (Z9/36) — 36 sessions, 60 distinct council members. Cross-checked against Brno's
    own official meeting listing (https://www.brno.cz/zasedani-zmb): Z9/36 (2026-06-23) is
    genuinely the latest HELD session; Z9/37 (2026-09-15) is scheduled but hasn't happened yet
    (consistent with a summer recess) — so there is currently no known coverage gap, not just a
    smaller one. Re-verify this against brno.cz's listing on every pipeline run regardless (nightly,
    once wired up) — this file's own history is a reminder that "the feed looks complete" isn't
    self-evidently true without that external check.
  g2_cross_check_approach: >
    No independently-published per-event aggregate is available in this feed (sumarizace is
    always empty here) or reachable from this environment: apl.brno.cz (linked per-event as
    urlProtokol, presumably the official signed protocol with a published pro/proti/zdrzel table)
    resolves via DNS but times out on every connection attempt from this sandbox (tested http and
    https, 20-30s timeouts) while www.brno.cz and kod.brno.cz root both work fine — likely a
    firewall/network-path issue specific to this sandbox, not necessarily true from GitHub
    Actions' network. standardize.py therefore uses a self-consistency check as the primary G2
    signal (recomputed yes/no majority vs. the source's own published `prijato` pass/fail
    boolean, which is asserted independently by the council's own voting system, not derived from
    our per-person tally) — see standardize.py's docstring for the exact rule and observed
    mismatch rate. It also makes a best-effort (non-blocking) attempt to fetch a sample of
    urlProtokol pages for a genuine independent aggregate cross-check; if apl.brno.cz is
    unreachable (as in this sandbox) it logs that plainly and does not fail the gate on a network
    problem. Re-attempt from CI to see if the protocol pages are reachable there.
  known_data_quality_findings:
    - "One single vote event (hlasovani id=4962, session Z9/11, 2023-10-18, cislo '12') has 48 of
      its 55 zastupiteleHlasy entries with `hlas: 0` (a bare JSON integer, not one of the
      documented string codes) instead of a real vote value — a source-side export bug isolated
      to this one record (only 6 valid '–' and 1 valid 'A' remain). standardize.py does not
      fabricate a vote for these 48 people; it omits their votes.csv rows for this event and logs
      the anomaly in the event's extras.data_quality."
    - "Two distinct council members share the exact name 'Petr Bořecký' (source ids 3 and 121) —
      a genuine G5 namesake collision, confirmed real (not a source duplicate): id 3 sat
      2022-10-20→2025-11-11 for ANO 2011 (politickeSubjekt id 2) with a vote recorded in every
      single one of the 2813 sessions; id 121 sat 2024-01-30→2025-11-11 for Lidovci a Starostové
      (politickeSubjekt id 13), overlapping id 3's tenure and voting in the same sessions from
      2024-01-30 onward. Disambiguated by suffixing the source's own numeric id to both person
      IDs (brno:person:petr-borecky-3 / brno:person:petr-borecky-121) — never merged, per G5."
    - "One member (source id 91, Karin Podivinská) has a documented former name in the source's
      `aliasy` field: 'Karin Karasová' until 2022-10-20 (a maiden-name change, consistent with the
      term's start date) — votes always reference the numeric id, not the name, so this poses no
      identity risk, but the former name is recorded as a person identifier for completeness."
  party_and_membership_data_available_for_c4: >
    Unlike Praha (where party affiliation had to be sourced separately from volby.cz per D7's
    fallback rule), this feed's `politickeSubjekty` array gives each council member's REAL,
    live party/klub membership with since/until date intervals directly — exactly D7's *preferred*
    case ("a live/current group-membership source... with since/until intervals"), not the
    candidate-list fallback. `koalice`/`lidr` similarly give real coalition composition and mayor
    intervals. C2 deliberately does NOT build party/coalition organizations or memberships from
    this — per the plan's scope boundary (C2 must not attempt C4-owned, sign-off-gated coalition
    facts) — but whoever picks up C4 should use this in-feed data directly rather than researching
    it from scratch; it is much stronger evidence than Praha had at the same stage.
  legacy_reconciliation: >
    legacy/brno/data/vote_events.csv covers 2022-10-20 through 2024-05-14 (1584 rows, from the old
    kod.brno.cz scraper, filtered to `present > 10` to skip empty/error votes) and voters.csv has
    56 distinct voters. The same window in this feed has 1589 vote events (99.7% match, the 5-row
    difference plausibly explained by legacy's own filter dropping near-empty votes that this
    feed still includes) and exactly 56 distinct zastupitele who cast at least one recorded vote —
    an exact match. See C2's commit message / pipeline run log for the full reconciliation report.
