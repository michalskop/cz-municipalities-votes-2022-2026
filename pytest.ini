[pytest]
# Every city's golden-sample test is named test_golden_sample.py (see <city>/tests/) — without
# --import-mode=importlib, pytest's default rootdir-based import collides on that shared basename
# the moment a second city has one (surfaced 2026-08-26 adding brno/tests/test_golden_sample.py
# alongside praha/tests/test_golden_sample.py). importlib mode imports by full file path instead
# of by basename, so same-named test files in different city directories never collide — no
# __init__.py files needed in the test directories.
addopts = --import-mode=importlib
