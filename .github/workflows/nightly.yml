# Nightly automation for the Praha, Brno, Ostrava and Most pipelines (plan.md tasks C6/C6-equivalent).
#
# LIVE since 2026-08-25 (Praha) / 2026-08-27 (Brno, Ostrava) / 2026-08-28 (Most) — pushed to
# origin/main; runs on the schedule below plus workflow_dispatch.
#
# Shape per city: checkout -> install deps -> run the pipeline (download -> standardize -> G1 -> G2)
# -> city-specific re-apply step(s) for data the standardizer can't retain on its own (Praha:
# party-affiliation fix + praha.eu roster overlay + staleness warning; Brno/Ostrava: real party/klub
# data from party_affiliation.py, Ostrava's additionally with its own staleness warning — see that
# city's check_klub_staleness.py) -> G4 monotonicity guard (against the pre-run committed state) ->
# clone the shared analyses repo -> run the four analyses -> detect the WPCA government axis ->
# G7 range-sanity check each output -> commit + push, but only if every preceding step succeeded
# (GitHub Actions' default behavior: a failing step stops the job before later steps, including the
# commit step, ever run — no extra plumbing needed for that).
#
# FOUR SEQUENTIAL jobs (brno needs: praha, ostrava needs: brno, most needs: ostrava), not a matrix
# and not parallel: (1) each city's re-apply step sequence genuinely differs (Praha has 3 such
# steps, Brno and Most have 1, Ostrava has 2) — a matrix would need per-city conditional steps
# anyway, no real simplification over four job bodies; (2) every job ends with `git pull --rebase
# && git push` against the same branch — running them in parallel would race (job B's rebase can go stale between its own pull
# and push if job A pushes in between, failing job B's push non-fast-forward). Sequential via
# `needs:` avoids that whole class of failure at the cost of extra total runtime, which a
# once-nightly job doesn't need to optimize away.
#
# Ostrava-specific: its downloader fetches ~2,100+ individual HTML pages (no bulk API — see
# ostrava/scripts/downloader.py), cached to ostrava/work/raw/ so a normal run only fetches whatever
# a new meeting/vote added since last time. That cache is NOT committed (ostrava/work/ is
# gitignored, matching every other city's work/ dir) and GitHub Actions runners are ephemeral, so
# without deliberately persisting it across runs, EVERY nightly run would re-scrape the entire
# term from scratch — slow, and impolite to a small municipal server. The `actions/cache` step
# below persists it: `restore-keys: ostrava-raw-` restores the most recent prior run's cache (even
# though today's exact key, which embeds `github.run_id`, never matches an existing entry), and the
# job always saves a new cache entry under that always-fresh key at the end — the standard pattern
# for an incrementally-growing cache. Praha/Brno need no equivalent: each fetches one JSON/CSV file
# per run, cheap enough to always re-fetch in full.
name: nightly

on:
  schedule:
    # 02:17 UTC — off-peak for both CZ (UTC+1/+2) and US audiences, and deliberately not on the
    # hour to avoid GitHub Actions' well-known top-of-hour scheduling congestion for cron jobs.
    - cron: "17 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  praha:
    name: Praha nightly pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Praha pipeline (download -> standardize -> G1 schema gate -> G2 cross-check)
        run: python praha/pipelines/run_pipeline.py

      - name: Re-apply candidate-list party affiliation (D7 fallback)
        # standardize.py (called by run_pipeline.py above) rewrites organizations.csv/
        # memberships.csv from scratch every run, which would silently drop the
        # praha:org:candidate-list:* rows this script adds — so it must run again right after,
        # every night. See praha/pipelines/run_pipeline.py's module docstring ("RESOLVED (C6,
        # ...)") for the full reasoning: this is cheap (six static-site GETs, once/day) and avoids
        # making standardize.py do fragile read-modify-write merging against another script's
        # output.
        run: python praha/scripts/party_affiliation.py --data-dir praha/data

      - name: Re-apply praha.eu roster overlay (mid-term personnel changes Golemio can't see)
        # Same class of gap as the party-affiliation step above, for a different blind spot: a
        # personnel change (new substitute, klub exclusion) that has no covering roll-call vote
        # yet is invisible to standardize.py, and a klub change after 2022 is invisible to
        # party_affiliation.py's fixed election-results source. roster_overlay.py's rows are
        # manually diagnosed+cited against a past praha.eu fetch (see its VERIFIED_AS_OF) and must
        # be re-applied every night the same way, or they silently disappear/revert. Added after
        # the 2026-08-25 manual nightly run failed G4 for exactly this reason.
        run: python praha/scripts/roster_overlay.py --data-dir praha/data

      - name: Check roster overlay staleness (non-blocking)
        # Warns (does not fail the job) once VERIFIED_AS_OF is more than 30 days old — a reminder
        # to re-run fetch_praha_roster.py and look for any *new*, not-yet-diagnosed personnel gap.
        # See check_roster_overlay_staleness.py's docstring for why this can't be a hard gate.
        run: python praha/scripts/check_roster_overlay_staleness.py

      - name: G4 monotonicity guard
        # Must run BEFORE anything is staged/committed: it diffs the just-regenerated working tree
        # against `git show HEAD:<path>`, i.e. the state committed by the *previous* nightly run.
        # Fails the job loudly (non-zero exit) on any disappeared row or >1% of matched rows
        # changing, per plan.md G4.
        run: python scripts/monotonicity_guard.py --data-dir praha/data

      - name: Clone legislature-data-analyses
        run: |
          git clone --depth=1 https://github.com/michalskop/legislature-data-analyses.git /tmp/legislature-data-analyses

      - name: Run attendance analysis
        run: |
          python praha/scripts/analyses/run_attendance.py \
            --script /tmp/legislature-data-analyses/attendance/attendance.py

      - name: Run rebelity analysis
        run: |
          python praha/scripts/analyses/run_rebelity.py \
            --script /tmp/legislature-data-analyses/rebelity/rebelity.py

      - name: Run govity analysis
        run: |
          python praha/scripts/analyses/run_govity.py \
            --script /tmp/legislature-data-analyses/govity/govity.py

      - name: Run wpca analysis
        run: |
          python praha/scripts/analyses/run_wpca.py \
            --script /tmp/legislature-data-analyses/wpca/wpca.py

      - name: Detect government/opposition WPCA axis
        # Which wpca.json dims[] index correlates with real government/opposition membership is
        # not fixed — it emerges from the vote data and can shift after a coalition change. Runs
        # after wpca so it reads that night's freshly regenerated wpca.json, and writes the
        # sidecar praha/analyses/wpca/outputs/government_axis.json (not a change to wpca.json
        # itself, which is schema-validated by G1).
        run: python praha/scripts/detect_government_axis.py

      - name: G7 range sanity check on analysis outputs
        run: |
          python scripts/g7_sanity_check.py --output-file praha/analyses/attendance/outputs/attendance.json
          python scripts/g7_sanity_check.py --output-file praha/analyses/rebelity/outputs/rebelity.json
          python scripts/g7_sanity_check.py --output-file praha/analyses/govity/outputs/govity.json
          python scripts/g7_sanity_check.py --output-file praha/analyses/wpca/outputs/wpca.json
          python scripts/g7_sanity_check.py --output-file praha/analyses/wpca/outputs/wpca_time.json

      # Future step (task A4, not built yet — no dashboard is deployed): ping the dashboard's
      # revalidate endpoint here once it exists, so ISR picks up tonight's commit without waiting
      # for its own cache window.

      - name: Commit and push updated data + analysis outputs
        # Reached only if every step above exited 0 — a failed step stops the job here by default,
        # so nothing below ever commits/pushes bad data. On failure, GitHub's own Actions-tab
        # failure surfacing (and, if configured, email notification to the repo owner) is the
        # entire failure-handling story here — a solo-maintainer project doesn't need a custom
        # issue-creation step on top of that per plan.md C6.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add praha/data/ praha/analyses/*/outputs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Nightly Praha data + analysis update"
          git pull --rebase
          git push

  brno:
    name: Brno nightly pipeline
    needs: praha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Brno pipeline (download -> standardize -> G1 schema gate -> G2 cross-check)
        run: python brno/pipelines/run_pipeline.py

      - name: Re-apply real party/klub data (D7 preferred case)
        # standardize.py rewrites organizations.csv/memberships.csv from scratch every run, which
        # would silently drop the brno:org:group:* rows this script adds — same class of gap as
        # Praha's party_affiliation.py step, see that script's module docstring. Unlike Praha,
        # this is real live group data straight from the feed already downloaded this run, not a
        # separate fetch — cheap to re-run every night.
        run: python brno/scripts/party_affiliation.py --data-dir brno/data

      - name: G4 monotonicity guard
        run: python scripts/monotonicity_guard.py --data-dir brno/data

      - name: Clone legislature-data-analyses
        run: |
          git clone --depth=1 https://github.com/michalskop/legislature-data-analyses.git /tmp/legislature-data-analyses

      - name: Run attendance analysis
        run: |
          python brno/scripts/analyses/run_attendance.py \
            --script /tmp/legislature-data-analyses/attendance/attendance.py

      - name: Run rebelity analysis
        run: |
          python brno/scripts/analyses/run_rebelity.py \
            --script /tmp/legislature-data-analyses/rebelity/rebelity.py

      - name: Run govity analysis
        run: |
          python brno/scripts/analyses/run_govity.py \
            --script /tmp/legislature-data-analyses/govity/govity.py

      - name: Run wpca analysis
        run: |
          python brno/scripts/analyses/run_wpca.py \
            --script /tmp/legislature-data-analyses/wpca/wpca.py

      - name: Detect government/opposition WPCA axis
        run: python brno/scripts/detect_government_axis.py

      - name: G7 range sanity check on analysis outputs
        run: |
          python scripts/g7_sanity_check.py --output-file brno/analyses/attendance/outputs/attendance.json
          python scripts/g7_sanity_check.py --output-file brno/analyses/rebelity/outputs/rebelity.json
          python scripts/g7_sanity_check.py --output-file brno/analyses/govity/outputs/govity.json
          python scripts/g7_sanity_check.py --output-file brno/analyses/wpca/outputs/wpca.json
          python scripts/g7_sanity_check.py --output-file brno/analyses/wpca/outputs/wpca_time.json
          python scripts/g7_sanity_check.py --output-file brno/analyses/wpca/outputs/government_axis.json

      - name: Commit and push updated data + analysis outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add brno/data/ brno/analyses/*/outputs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Nightly Brno data + analysis update"
          git pull --rebase
          git push

  ostrava:
    name: Ostrava nightly pipeline
    needs: brno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Ostrava raw-page cache
        # See the file-level comment above for why this exists and how the key/restore-keys
        # combination gives an incrementally-growing cache across runs.
        uses: actions/cache@v4
        with:
          path: ostrava/work/raw
          key: ostrava-raw-${{ github.run_id }}
          restore-keys: |
            ostrava-raw-

      - name: Run Ostrava pipeline (download -> standardize -> G1 schema gate -> G2 cross-check)
        # Incremental: downloader.py skips any meeting/vote page already present in the restored
        # cache, so a normal night fetches only what's new (typically 0 or 1 new meeting's worth
        # of votes), not the full ~2,100+ page corpus.
        run: python ostrava/pipelines/run_pipeline.py

      - name: Re-apply real klub data (D7 preferred case, dated history)
        # standardize.py rewrites organizations.csv/memberships.csv from scratch every run, which
        # would silently drop the ostrava:org:group:* rows this script adds — same class of gap as
        # Brno's party_affiliation.py step. Reads the same cached raw/ pages standardize.py just
        # used, no separate fetch. See that script's module docstring: klub grouping has published
        # nothing new since 2025-06-18, so most nights this step reproduces the same intervals
        # unchanged (harmless — write_outputs dedups by id) until the site (if ever) resumes
        # publishing it or a new meeting's first vote happens to include it again.
        run: python ostrava/scripts/party_affiliation.py

      - name: Check klub data staleness (non-blocking)
        # Warns (does not fail the job) once the last confirmed klub snapshot is more than 60 days
        # old — already firing every night as of this writing (last confirmed 2025-06-18). See
        # check_klub_staleness.py's docstring for why this can't be a hard gate.
        run: python ostrava/scripts/check_klub_staleness.py

      - name: G4 monotonicity guard
        run: python scripts/monotonicity_guard.py --data-dir ostrava/data

      - name: Clone legislature-data-analyses
        run: |
          git clone --depth=1 https://github.com/michalskop/legislature-data-analyses.git /tmp/legislature-data-analyses

      - name: Run attendance analysis
        run: |
          python ostrava/scripts/analyses/run_attendance.py \
            --script /tmp/legislature-data-analyses/attendance/attendance.py

      - name: Run rebelity analysis
        run: |
          python ostrava/scripts/analyses/run_rebelity.py \
            --script /tmp/legislature-data-analyses/rebelity/rebelity.py

      - name: Run govity analysis
        run: |
          python ostrava/scripts/analyses/run_govity.py \
            --script /tmp/legislature-data-analyses/govity/govity.py

      - name: Run wpca analysis
        run: |
          python ostrava/scripts/analyses/run_wpca.py \
            --script /tmp/legislature-data-analyses/wpca/wpca.py

      - name: Detect government/opposition WPCA axis
        run: python ostrava/scripts/detect_government_axis.py

      - name: G7 range sanity check on analysis outputs
        run: |
          python scripts/g7_sanity_check.py --output-file ostrava/analyses/attendance/outputs/attendance.json
          python scripts/g7_sanity_check.py --output-file ostrava/analyses/rebelity/outputs/rebelity.json
          python scripts/g7_sanity_check.py --output-file ostrava/analyses/govity/outputs/govity.json
          python scripts/g7_sanity_check.py --output-file ostrava/analyses/wpca/outputs/wpca.json
          python scripts/g7_sanity_check.py --output-file ostrava/analyses/wpca/outputs/wpca_time.json
          python scripts/g7_sanity_check.py --output-file ostrava/analyses/wpca/outputs/government_axis.json

      - name: Commit and push updated data + analysis outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ostrava/data/ ostrava/analyses/*/outputs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Nightly Ostrava data + analysis update"
          git pull --rebase
          git push

  most:
    name: Most nightly pipeline
    needs: ostrava
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Most pipeline (download -> standardize -> G1 schema gate -> G2 cross-check)
        run: python most/pipelines/run_pipeline.py

      - name: Re-apply real party/klub data (D7 preferred case)
        # standardize.py rewrites organizations.csv/memberships.csv from scratch every run, which
        # would silently drop the most:org:group:* rows this script adds — same class of gap as
        # Brno's party_affiliation.py step, see that script's module docstring. Real live group
        # data straight from the same feed already downloaded this run, not a separate fetch.
        run: python most/scripts/party_affiliation.py --data-dir most/data

      - name: G4 monotonicity guard
        run: python scripts/monotonicity_guard.py --data-dir most/data

      - name: Clone legislature-data-analyses
        run: |
          git clone --depth=1 https://github.com/michalskop/legislature-data-analyses.git /tmp/legislature-data-analyses

      - name: Run attendance analysis
        run: |
          python most/scripts/analyses/run_attendance.py \
            --script /tmp/legislature-data-analyses/attendance/attendance.py

      - name: Run rebelity analysis
        run: |
          python most/scripts/analyses/run_rebelity.py \
            --script /tmp/legislature-data-analyses/rebelity/rebelity.py

      - name: Run govity analysis
        run: |
          python most/scripts/analyses/run_govity.py \
            --script /tmp/legislature-data-analyses/govity/govity.py

      - name: Run wpca analysis
        run: |
          python most/scripts/analyses/run_wpca.py \
            --script /tmp/legislature-data-analyses/wpca/wpca.py

      - name: Detect government/opposition WPCA axis
        run: python most/scripts/detect_government_axis.py

      - name: G7 range sanity check on analysis outputs
        run: |
          python scripts/g7_sanity_check.py --output-file most/analyses/attendance/outputs/attendance.json
          python scripts/g7_sanity_check.py --output-file most/analyses/rebelity/outputs/rebelity.json
          python scripts/g7_sanity_check.py --output-file most/analyses/govity/outputs/govity.json
          python scripts/g7_sanity_check.py --output-file most/analyses/wpca/outputs/wpca.json
          python scripts/g7_sanity_check.py --output-file most/analyses/wpca/outputs/wpca_time.json
          python scripts/g7_sanity_check.py --output-file most/analyses/wpca/outputs/government_axis.json

      - name: Commit and push updated data + analysis outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add most/data/ most/analyses/*/outputs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Nightly Most data + analysis update"
          git pull --rebase
          git push
