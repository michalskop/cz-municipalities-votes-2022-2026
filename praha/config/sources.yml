# Source config for Praha. Populated 2026-08-04 per research/R1-praha.md (D8 decision).
# The old praha.eu HTML scraper (legacy/praha/scripts/) is confirmed broken (302-redirects) —
# do not resurrect it. Use the open-data CSV instead.

vysledky_hlasovani_zhmp:
  primary:
    type: csv
    url: "https://storage.golemio.cz/ckan/obis/Vysledky_hlasovani_ZHMP_2022_-_2026.csv"
    schema: "https://opendata-storage.praha.eu/OVO_vysledky_hlasovani_zhmp/Vysledky_hlasovani_ZHMP.schema.json"
    docs: "https://opendata-storage.praha.eu/OVO_vysledky_hlasovani_zhmp/Vysledky_hlasovani_ZHMP_dokumentace.html"
    licence: "CC BY 4.0"
    catalog_entry: "https://data.gov.cz/dataset?iri=https%3A%2F%2Fdata.gov.cz%2Fzdroj%2Fdatov%C3%A9-sady%2F00064581%2Faaf8f062015cc627d5f247d6bd6cf9ac"
    note: >
      Wide format: one row per vote event, one column per councilor (header = full name with
      academic titles). Vote vocabulary: "Hlas pro" = yes, "Hlas proti" = no, "Zdržel se" =
      abstain, "Nehlasoval" = present/no vote, "Chyběl" = absent, empty = not a member at that
      date. KNOWN DATA-QUALITY PATTERN (see research/R1-praha.md): 124/2346 rows undercount the
      published "pocetpro" aggregate by exactly one vote, clustered on 5 specific meeting dates —
      indicates a mid-term substitute councilor not present in the fixed column roster. C7 must
      detect and handle this, not silently under-count or hard-fail on it.
  group_affiliation_source: >
    RESOLVED 2026-08-04 (C8), per plan.md D7's standing rule. Praha's current
    praha.eu/seznam-zastupitelu is a client-rendered SPA with no discoverable API (confirmed
    dead-end this session, no browser automation available) — the old praha.eu HTML scraper
    target is also dead (see the note at the top of this file). Live/current klub data is
    therefore not scrapable; falling back to each councilor's original candidate-list (party)
    affiliation from the official 2022 municipal election results, per D7's documented fallback.
    Source: volby.cz's 2022 Praha results (xobec=554782, xnumnuts=1100) — aggregate list results
    at kv1111?...&xobec=554782, per-list candidate results (elected candidates marked '*') at
    kv111111?...&xstrana=<id>. Implemented in praha/scripts/party_affiliation.py, which writes
    `praha:org:candidate-list:*` organizations (classification: candidate_list, NOT "group" — D7's
    distinction) and matching memberships. All 66 persons.csv entries matched (65 originally
    elected + 1 documented mid-term substitute, Tomáš Kaněra — see that script's
    _KNOWN_SUBSTITUTES table for the citation). Six lists won seats: SPOLU pro Prahu (19),
    ANO 2011 (14), Česká pirátská strana (13), PRAHA SOBĚ (11), STAROSTOVÉ A NEZÁVISLÍ (5),
    SPD,Trik.,PES a nez. pro Prahu (3) — 65 seats total, verified against volby.cz's own aggregate
    page (resolves an 18-vs-19-seat discrepancy in one secondary source: SPOLU pro Prahu won 19).

    ADDENDUM 2026-08-06: the "no browser automation available" conclusion above was a limitation
    of that session's tooling, not of praha.eu itself. Real browser automation (Playwright, driven
    against the system-installed Chromium — see requirements.txt and
    praha/scripts/fetch_praha_roster.py) *can* read praha.eu/seznam-zastupitelu and
    praha.eu/politicke-kluby; both are just client-rendered Angular SPAs that a plain HTTP client
    can't execute. This was used for a one-time reconciliation against 4 personnel changes the
    stale Golemio CSV pipeline structurally could not see (see persons.csv/memberships.csv commit
    history around 2026-08-06 and DIVERGENCE.md in the dashboard repo for the full story). This
    does NOT replace `group_affiliation_source` above as the pipeline's regular/nightly source —
    that remains the volby.cz candidate-list fallback, re-applied every run by
    party_affiliation.py. Whether a live praha.eu roster check should become a recurring
    (nightly/periodic) pipeline step, replacing or supplementing the candidate-list fallback, is
    an open follow-up, not decided here.
